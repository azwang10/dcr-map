<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DCR Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
  <style>
    @font-face {
      font-family: "Stone Sans";
      src: url("StoneSans.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
    }
    body { margin: 0; font-family: "Stone Sans", sans-serif; }
    html, body, #map { height: 100%; }
    .maplibregl-ctrl-attrib,
    .maplibregl-ctrl-attrib a,
    .maplibregl-popup-content {
      font-family: "Stone Sans", sans-serif;
    }
    #sidebar {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 0;
      width: 240px;
      max-height: 100%;
      overflow: auto;
      background: #fff;
      font: 14px/1.35 "Stone Sans", sans-serif;
    }
    #sidebar h1 { margin: 0; font-size: 16px; }
    #sidebar h1 label { display: block; padding: 12px 14px; cursor: pointer; }
    #controls-content { padding: 0 14px 14px; }
    #sidebar-toggle:checked ~ #controls-content { display: none; }
    #places { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
    #places button {
      width: 100%;
      padding: 6px 0;
      border: 0;
      background: none;
      text-align: left;
      font: inherit;
      color: rgb(0, 102, 73);
      cursor: pointer;
    }
    #places button[aria-current="true"] { font-weight: 700; }
    .control-button { display: inline-block; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <input id="sidebar-toggle" type="checkbox" hidden>
    <h1><label for="sidebar-toggle">Parks</label></h1>
    <div id="controls-content">
      <ul id="places">
        <li><button type="button" data-lng="-71.15614" data-lat="42.07081">Borderland State Park</button></li>
        <li><button type="button" data-lng="-71.89235" data-lat="42.48693">Wachusett Mountain</button></li>
        <li><button type="button" data-lng="-71.33864" data-lat="42.43760">Walden Pond</button></li>
        <li><button type="button" data-lng="-73.17143" data-lat="42.54494">Ashuwillticook Rail Trail</button></li>
        <li><button type="button" data-lng="-73.26912" data-lat="42.23144">Beartown State Forest</button></li>
        <li><button type="button" data-lng="-71.62211" data-lat="42.11254">Blackstone River and Canal</button></li>
        <li><button type="button" data-lng="-72.37736" data-lat="42.61872">Erving State Forest</button></li>
        <li><button type="button" data-lng="-72.96976" data-lat="42.05438">Granville State Forest</button></li>
        <li><button type="button" data-lng="-71.07410" data-lat="42.61274">Harold Parker State Forest</button></li>
        <li><button type="button" data-lng="-72.94472" data-lat="42.62699">Mohawk Trail State Forest</button></li>
        <li><button type="button" data-lng="-72.98583" data-lat="42.71586">Monroe State Forest</button></li>
        <li><button type="button" data-lng="-72.35430" data-lat="42.69107">Mt. Grace State Forest</button></li>
        <li><button type="button" data-lng="-73.48945" data-lat="42.07784">Mt. Washington State Forest</button></li>
        <li><button type="button" data-lng="-72.10702" data-lat="42.62116">Otter River State Forest</button></li>
        <li><button type="button" data-lng="-71.71692" data-lat="42.12873">Purgatory Chasm</button></li>
        <li><button type="button" data-lng="-71.59744" data-lat="42.20303">Upton State Forest</button></li>
        <li><button type="button" data-lng="-72.06873" data-lat="42.14509">Wells State Park</button></li>
        <li><button type="button" data-lng="-72.43762" data-lat="42.56490">Wendell State Forest</button></li>
        <li><button type="button" data-lng="-71.76902" data-lat="42.65522">Willard Brook State Forest</button></li>
      </ul>
      <label class="control-button" for="sidebar-toggle">Hide sidebar</label>
    </div>
  </div>
  <script>
    const dem = new mlcontour.DemSource({
      url: "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp",
      encoding: "terrarium",
      maxzoom: 12
    });
    dem.setupMaplibre(maplibregl);

    const map = new maplibregl.Map({
      container: "map",
      style: "dcr_style.json",
      zoom: 11,
      center: [-71.19, 42.34],
      pitch: 0,
      maxPitch: 0,
      pitchWithRotate: false,
      touchPitch: false
    });

    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");
    map.addControl(geolocate, "top-right");
    map.on("load", () => geolocate.trigger());

    const places = document.getElementById("places");
    places.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const locate = document.querySelector(".maplibregl-ctrl-geolocate");
      if (locate && (locate.classList.contains("maplibregl-ctrl-geolocate-active") || locate.classList.contains("maplibregl-ctrl-geolocate-background"))) {
        locate.click();
      }
      for (const item of places.querySelectorAll("button")) item.removeAttribute("aria-current");
      button.setAttribute("aria-current", "true");
      const hidden = document.getElementById("sidebar-toggle").checked;
      map.flyTo({
        center: [Number(button.dataset.lng), Number(button.dataset.lat)],
        zoom: 13,
        padding: { left: hidden ? 0 : 240 }
      });
    });
  </script>
</body>
</html>
