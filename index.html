<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DCR Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
  <style>
    @font-face {
      font-family: "Stone Sans";
      src: url("StoneSans.otf") format("opentype");
    }
    body { margin: 0; font-family: "Stone Sans", sans-serif; }
    html, body, #map { height: 100%; }
    .maplibregl-map { font-family: "Stone Sans", sans-serif; }

    #sidebar {
      position: absolute;
      z-index: 1;
      top: 0;
      left: 0;
      width: 240px;
      max-height: 100%;
      overflow: auto;
      background: #fff;
      font-size: 14px;
    }
    #sidebar h1 { margin: 0; font-size: 16px; }
    #sidebar h1 label { display: block; padding: 12px 14px; cursor: pointer; }
    #content { padding: 0 14px 14px; }
    #toggle:checked ~ #content { display: none; }
    #places { margin: 0; padding: 0; list-style: none; }
    #places button {
      width: 100%;
      padding: 6px 0;
      border: 0;
      background: none;
      text-align: left;
      font: inherit;
      color: #006649;
      cursor: pointer;
    }
    #places button[aria-current] { font-weight: 700; }
    #hide { display: inline-block; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <input id="toggle" type="checkbox" hidden>
    <h1><label for="toggle">Parks</label></h1>
    <div id="content">
      <ul id="places"></ul>
      <label id="hide" for="toggle">Hide sidebar</label>
    </div>
  </div>
  <script>
    const parks = [
      ["Borderland State Park", -71.15614, 42.07081],
      ["Wachusett Mountain", -71.89235, 42.48693],
      ["Walden Pond", -71.33864, 42.43760],
      ["Ashuwillticook Rail Trail", -73.17143, 42.54494],
      ["Beartown State Forest", -73.26912, 42.23144],
      ["Blackstone River and Canal", -71.62211, 42.11254],
      ["Erving State Forest", -72.37736, 42.61872],
      ["Granville State Forest", -72.96976, 42.05438],
      ["Harold Parker State Forest", -71.07410, 42.61274],
      ["Mohawk Trail State Forest", -72.94472, 42.62699],
      ["Monroe State Forest", -72.98583, 42.71586],
      ["Mt. Grace State Forest", -72.35430, 42.69107],
      ["Mt. Washington State Forest", -73.48945, 42.07784],
      ["Otter River State Forest", -72.10702, 42.62116],
      ["Purgatory Chasm", -71.71692, 42.12873],
      ["Upton State Forest", -71.59744, 42.20303],
      ["Wells State Park", -72.06873, 42.14509],
      ["Wendell State Forest", -72.43762, 42.56490],
      ["Willard Brook State Forest", -71.76902, 42.65522]
    ];

    const dem = new mlcontour.DemSource({
      url: "https://tiles.mapterhorn.com/{z}/{x}/{y}.webp",
      encoding: "terrarium",
      maxzoom: 12
    });
    dem.setupMaplibre(maplibregl);

    const map = new maplibregl.Map({
      container: "map",
      style: "dcr_style.json",
      center: [-71.19, 42.34],
      zoom: 11,
      maxPitch: 0
    });

    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");
    map.addControl(geolocate, "top-right");
    map.on("load", () => geolocate.trigger());

    const list = document.getElementById("places");
    const toggle = document.getElementById("toggle");

    for (const [name, lng, lat] of parks) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = name;
      button.addEventListener("click", () => {
        // Stop following the user so the map can fly to the park.
        const locate = document.querySelector(".maplibregl-ctrl-geolocate");
        if (locate.matches(".maplibregl-ctrl-geolocate-active, .maplibregl-ctrl-geolocate-background")) {
          locate.click();
        }
        list.querySelector("[aria-current]")?.removeAttribute("aria-current");
        button.setAttribute("aria-current", "true");
        map.flyTo({
          center: [lng, lat],
          zoom: 13,
          padding: { left: toggle.checked ? 0 : 240 }
        });
      });
      const item = document.createElement("li");
      item.append(button);
      list.append(item);
    }
  </script>
</body>
</html>
